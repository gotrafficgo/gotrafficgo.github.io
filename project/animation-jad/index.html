<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="format-detection" content="telephone=no" />
    <meta
      name="description"
      content="Jam-absorption driving animation from the dedicated vehicle dispatch project."
    />
    <title>Jam-Absorption Driving Animation | Zhengbing He</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f7f7f7;
      }

      .animation-frame {
        display: block;
        width: 100%;
        height: 900px;
        border: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <iframe
      class="animation-frame"
      id="jadAnimationFrame"
      src="../dedicated-vehicle-dispatch/index.html?animation-embed=1"
      title="Jam-absorption driving animation"
      scrolling="no"
      loading="eager"
    ></iframe>

    <script>
      (() => {
        const frame = document.getElementById("jadAnimationFrame");
        let observer;

        const fitAnimation = () => {
          const animation = frame.contentDocument?.getElementById("jadAnimation");
          if (!animation) return;

          const styles = frame.contentWindow.getComputedStyle(animation);
          const height =
            animation.getBoundingClientRect().height +
            parseFloat(styles.marginTop) +
            parseFloat(styles.marginBottom);

          frame.style.height = `${Math.ceil(height)}px`;
        };

        frame.addEventListener("load", () => {
          fitAnimation();
          const animation = frame.contentDocument?.getElementById("jadAnimation");
          if (animation && "ResizeObserver" in window) {
            observer?.disconnect();
            observer = new ResizeObserver(fitAnimation);
            observer.observe(animation);
          }
        });

        window.addEventListener("resize", fitAnimation);
      })();
    </script>
  </body>
</html>
