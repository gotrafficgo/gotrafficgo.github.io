<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="format-detection" content="telephone=no" />
    <meta
      name="description"
      content="Intersection congestion identification video and reference on network-wide turn-level congestion using low-frequency probe vehicle data."
    />
    <title>Intersection Congestion Identification Animation | Zhengbing He</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        background: #f7f7f7;
        color: #222;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial,
          sans-serif;
      }

      .video-hero {
        width: 100%;
        height: 100vh;
        height: 100svh;
        background: #000;
      }

      .video-frame {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }

      .video-links {
        padding: 10px 24px 0;
        line-height: 1.5;
        text-align: left;
      }

      .video-links a {
        color: #0969da;
      }

      .reference-section {
        padding: 48px 24px;
      }

      .reference-card {
        margin: 0;
        padding: 0;
        line-height: 1.6;
        text-align: left;
      }

      .paper-title {
        margin-bottom: 5px;
        font-weight: 700;
      }

      .paper-meta {
        margin-bottom: 8px;
        color: #666;
        font-size: 0.95rem;
      }

      .paper-links a,
      .paper-links button {
        appearance: none;
        display: inline-block;
        margin-right: 14px;
        padding: 0;
        border: 0;
        color: #0969da;
        background: none;
        font: inherit;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
      }

      .copy-status {
        color: #4b5563;
        font-size: 0.9rem;
      }

      @media (max-width: 600px) {
        .video-hero {
          height: auto;
          aspect-ratio: 16 / 9;
        }

        .video-links {
          padding-right: 16px;
          padding-left: 16px;
        }

        .reference-section {
          padding: 28px 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="video-hero">
      <iframe
        class="video-frame"
        id="congestionIdentificationVideo"
        src="https://www.youtube.com/embed/go9PKm3Haxo?autoplay=1&amp;playsinline=1"
        title="Intersection Congestion Identification video on YouTube"
        loading="eager"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen
      ></iframe>
    </div>

    <nav class="video-links" aria-label="Video platforms">
      <a href="https://youtu.be/go9PKm3Haxo" target="_blank" rel="noopener noreferrer">YouTube</a>
      <span aria-hidden="true"> | </span>
      <a href="https://www.bilibili.com/video/BV12m4y1h7Dx?t=0.9" target="_blank" rel="noopener noreferrer">Bilibili</a>
    </nav>

    <main class="reference-section">
      <article class="reference-card">
        <div class="paper-title">
          Network-Wide Identification of Turn-Level Intersection Congestion Using Only Low-Frequency Probe Vehicle Data
        </div>
        <div class="paper-meta">
          <strong>Zhengbing He</strong>, Geqi Qi, Lili Lu, Yanyan Chen ·
          Transportation Research Part C: Emerging Technologies · 108:320–339 ·
          2019
        </div>
        <div class="paper-links">
          <a
            href="https://doi.org/10.1016/j.trc.2019.10.001"
            target="_blank"
            rel="noopener noreferrer"
          >Link</a>
          <button id="copyBibtex" type="button">Copy BibTeX</button>
          <span class="copy-status" id="copyStatus" role="status" aria-live="polite"></span>
        </div>
      </article>
    </main>

    <script>
      (() => {
        const bibtex = `@article{he2019network,
  title = {Network-wide identification of turn-level intersection congestion using only low-frequency probe vehicle data},
  author = {He, Zhengbing and Qi, Geqi and Lu, Lili and Chen, Yanyan},
  journal = {Transportation Research Part C: Emerging Technologies},
  volume = {108},
  pages = {320--339},
  year = {2019},
  doi = {10.1016/j.trc.2019.10.001}
}`;

        const frame = document.getElementById("congestionIdentificationVideo");
        const button = document.getElementById("copyBibtex");
        const status = document.getElementById("copyStatus");
        const youtubeProbe = new Image();
        let settled = false;

        const useBilibili = () => {
          if (settled) return;
          settled = true;
          window.clearTimeout(probeTimeout);
          frame.src = "https://player.bilibili.com/player.html?bvid=BV12m4y1h7Dx&page=1&autoplay=1&t=0.9";
          frame.title = "Intersection Congestion Identification video on Bilibili";
        };

        const keepYouTube = () => {
          if (settled) return;
          settled = true;
          window.clearTimeout(probeTimeout);
        };

        const probeTimeout = window.setTimeout(useBilibili, 4000);
        youtubeProbe.onload = keepYouTube;
        youtubeProbe.onerror = useBilibili;
        youtubeProbe.src = "https://www.youtube.com/favicon.ico?video-probe=" + Date.now();

        button.addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(bibtex);
            status.textContent = "Copied";
          } catch {
            status.textContent = "Copy failed";
          }
        });
      })();
    </script>
  </body>
</html>
