name: Update Google Scholar stats

on:
  schedule:
    - cron: "23 17 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-google-scholar-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Fetch Google Scholar statistics
        run: python3 scripts/update_scholar_stats.py

      - name: Commit updated statistics
        run: |
          if git diff --quiet -- index.html; then
            echo "Google Scholar statistics are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "update Google Scholar statistics"
          git push
